syntax = "proto3";

package onyx.trace.v1;

import "onyx/common/v1/types.proto";
import "onyx/job/v1/job.proto";

option cc_enable_arenas = true;

message BuildIdentity {
  string source_revision = 1;
  bool source_dirty = 2;
  string runtime_version = 3;
  string backend_version = 4;
  string compiler_version = 5;
  bytes metallib_sha256 = 6;
  repeated string kernel_variant_ids = 7;
  bytes source_tree_sha256 = 8;
}

message RngExecution {
  string algorithm = 1;
  string algorithm_version = 2;
  string generator_device = 3;
  uint64 actual_seed = 4;
  bytes initial_noise_sha256 = 5;
  string noise_layout = 6;
}

enum CacheState {
  CACHE_STATE_UNSPECIFIED = 0;
  CACHE_STATE_COLD = 1;
  CACHE_STATE_WARM_MODEL_COLD_PLAN = 2;
  CACHE_STATE_WARM = 3;
}

message StageTiming {
  onyx.common.v1.StageIdentity stage = 1;
  uint64 encode_time_ns = 2;
  uint64 gpu_time_ns = 3;
  uint64 wall_time_ns = 4;
  uint64 peak_memory_bytes = 5;
}

message RunRecord {
  string protocol = 1;
  string run_id = 2;
  string request_id = 3;
  bytes request_digest = 4;
  optional onyx.job.v1.GenerateRequest replay_request = 5;
  onyx.job.v1.ModelRef resolved_model = 6;
  string plan_id = 7;
  string numeric_profile_id = 8;
  string quantization_profile_id = 9;
  BuildIdentity build = 10;
  onyx.common.v1.DeviceCapabilities device = 11;
  RngExecution rng = 12;
  CacheState cache_state = 13;
  int64 wall_start_unix_ns = 14;
  uint64 monotonic_start_ns = 15;
  uint64 total_wall_time_ns = 16;
  uint64 peak_memory_bytes = 17;
  repeated StageTiming stages = 18;
  repeated onyx.common.v1.Metric metrics = 19;
  repeated onyx.common.v1.ArtifactRef outputs = 20;
  repeated onyx.job.v1.RunEvent events = 21;
  onyx.common.v1.Error terminal_error = 22;
  repeated string command = 23;
}
