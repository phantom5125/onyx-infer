syntax = "proto3";

package onyx.common.v1;

option cc_enable_arenas = true;

enum DType {
  DTYPE_UNSPECIFIED = 0;
  DTYPE_BF16 = 1;
  DTYPE_FP16 = 2;
  DTYPE_FP32 = 3;
  DTYPE_FP64 = 4;
  DTYPE_INT8 = 5;
  DTYPE_UINT8 = 6;
  DTYPE_INT16 = 7;
  DTYPE_UINT16 = 8;
  DTYPE_INT32 = 9;
  DTYPE_UINT32 = 10;
  DTYPE_INT64 = 11;
  DTYPE_UINT64 = 12;
  DTYPE_BOOL = 13;
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_IMAGE = 1;
  ARTIFACT_KIND_TENSOR = 2;
  ARTIFACT_KIND_WEIGHTS = 3;
  ARTIFACT_KIND_MODEL = 4;
  ARTIFACT_KIND_PLAN = 5;
  ARTIFACT_KIND_TRACE = 6;
  ARTIFACT_KIND_PATCH = 7;
  ARTIFACT_KIND_OTHER = 15;
}

message ArtifactRef {
  string artifact_id = 1;
  string media_type = 2;
  uint64 byte_size = 3;
  bytes sha256 = 4;
  string local_locator = 5;
  ArtifactKind kind = 6;
  string schema = 7;
}

message ImageSize {
  uint32 width = 1;
  uint32 height = 2;
}

message StageIdentity {
  string stage_id = 1;
  uint32 stage_index = 2;
  optional uint32 step_index = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNSUPPORTED_PARAMETER = 2;
  ERROR_CODE_MODEL_NOT_FOUND = 3;
  ERROR_CODE_ARTIFACT_INTEGRITY = 4;
  ERROR_CODE_CAPABILITY_MISSING = 5;
  ERROR_CODE_PLAN_MISMATCH = 6;
  ERROR_CODE_RESOURCE_EXHAUSTED = 7;
  ERROR_CODE_NUMERIC_FAILURE = 8;
  ERROR_CODE_CANCELLED = 9;
  ERROR_CODE_DEADLINE_EXCEEDED = 10;
  ERROR_CODE_BACKEND_FAILURE = 11;
  ERROR_CODE_INTERNAL = 12;
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 13;
}

enum Retryability {
  RETRYABILITY_UNSPECIFIED = 0;
  RETRYABILITY_NO = 1;
  RETRYABILITY_AFTER_CHANGE = 2;
  RETRYABILITY_TRANSIENT = 3;
}

message Error {
  ErrorCode code = 1;
  Retryability retryability = 2;
  StageIdentity stage = 3;
  string message = 4;
  map<string, string> details = 5;
}

message Metric {
  string name = 1;
  double value = 2;
  string unit = 3;
  StageIdentity stage = 4;
  string source = 5;
}

message DeviceCapabilities {
  string target_id = 1;
  string model_identifier = 2;
  string chip = 3;
  uint32 cpu_cores = 4;
  uint32 gpu_cores = 5;
  uint64 physical_memory_bytes = 6;
  uint64 recommended_working_set_bytes = 7;
  uint64 max_buffer_bytes = 8;
  bool unified_memory = 9;
  string metal_version = 10;
  string os_version = 11;
  string os_build = 12;
  repeated string features = 13;
}
